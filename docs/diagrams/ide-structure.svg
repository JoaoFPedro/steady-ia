  <rect x="480" y="264" width="190" height="24" rx="4" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="280" font-size="9" font-family="Consolas, monospace" fill="#0C447C">copilot-instructions.md</text>
  <text x="660" y="280" text-anchor="end" font-size="8" fill="#64748B">sempre</text>

  <rect x="480" y="294" width="190" height="24" rx="4" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="310" font-size="9" font-family="Consolas, monospace" fill="#0C447C">spec-files.instructions.md</text>
  <text x="660" y="310" text-anchor="end" font-size="8" fill="#64748B">specs/**</text>

  <rect x="480" y="324" width="190" height="24" rx="4" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="340" font-size="9" font-family="Consolas, monospace" fill="#0C447C">implementation.instructions.md</text>
  <text x="660" y="340" text-anchor="end" font-size="8" fill="#64748B">src/**</text>

  <rect x="480" y="354" width="190" height="24" rx="4" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="370" font-size="9" font-family="Consolas, monospace" fill="#0C447C">adr-files.instructions.md</text>
  <text x="660" y="370" text-anchor="end" font-size="8" fill="#64748B">docs/adr/**</text>

  <rect x="480" y="384" width="190" height="24" rx="4" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="400" font-size="9" font-family="Consolas, monospace" fill="#0C447C">init.instructions.md</text>
  <text x="660" y="400" text-anchor="end" font-size="8" fill="#64748B">.sdd/**</text>

  <rect x="480" y="414" width="190" height="24" rx="4" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="430" font-size="9" font-family="Consolas, monospace" fill="#0C447C">onboarding.instructions.md</text>
  <text x="660" y="430" text-anchor="end" font-size="8" fill="#64748B">.sdd/memory/**</text>

  <!-- Bottom rule -->
  <rect x="30" y="480" width="660" height="60" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="360" y="502" text-anchor="middle" font-size="12" font-weight="600" fill="#2C2C2A">Regra fundamental</text>
  <text x="360" y="520" text-anchor="middle" font-size="11" fill="#5F5E5A">Regras de IDE apontam para .sdd/ — nunca duplicam conteúdo.</text>
  <text x="360" y="535" text-anchor="middle" font-size="11" fill="#5F5E5A">Se uma regra cresce demais, o conteúdo pertence ao .sdd/PLAYBOOK.md ou CONSTITUTION.md.</text>
</svg>
