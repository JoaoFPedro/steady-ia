  <text x="360" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">.sdd/ — core compartilhado</text>
  <text x="360" y="95" text-anchor="middle" font-size="10" fill="#64748B">fonte de verdade, lida por todas as IDEs</text>
  <text x="260" y="118" font-size="10" font-family="Consolas, monospace" fill="#534AB7">CONSTITUTION.md</text>
  <text x="260" y="134" font-size="10" font-family="Consolas, monospace" fill="#534AB7">STACK.md  PLAYBOOK.md</text>
  <text x="260" y="150" font-size="10" font-family="Consolas, monospace" fill="#534AB7">DESIGN.md  config.json</text>
  <text x="260" y="166" font-size="10" font-family="Consolas, monospace" fill="#534AB7">memory/  templates/</text>

  <!-- Arrows from core -->
  <line x1="240" y1="140" x2="180" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="230" x2="360" y2="280" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="140" x2="540" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="195" y="190" font-size="9" fill="#888780" text-anchor="middle">lê e segue</text>
  <text x="360" y="270" font-size="9" fill="#888780" text-anchor="middle">lê e segue</text>
  <text x="525" y="190" font-size="9" fill="#888780" text-anchor="middle">lê e segue</text>

