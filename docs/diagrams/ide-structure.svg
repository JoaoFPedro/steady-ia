  <text x="445" y="360" text-anchor="end" font-size="8" fill="#64748B">sempre</text>

  <rect x="265" y="374" width="190" height="24" rx="4" fill="white" stroke="#993C1D" stroke-width="0.5"/>
  <text x="275" y="390" font-size="9" font-family="Consolas, monospace" fill="#712B13">/discover /spec /plan /init</text>
  <text x="445" y="390" text-anchor="end" font-size="8" fill="#64748B">slash</text>

  <rect x="265" y="404" width="190" height="24" rx="4" fill="white" stroke="#993C1D" stroke-width="0.5"/>
  <text x="275" y="420" font-size="9" font-family="Consolas, monospace" fill="#712B13">/implement /review /sync</text>
  <text x="445" y="420" text-anchor="end" font-size="8" fill="#64748B">slash</text>

  <rect x="265" y="434" width="190" height="24" rx="4" fill="white" stroke="#993C1D" stroke-width="0.5"/>
  <text x="275" y="450" font-size="9" font-family="Consolas, monospace" fill="#712B13">/analyze /onboard /feature</text>
  <text x="445" y="450" text-anchor="end" font-size="8" fill="#64748B">slash</text>

