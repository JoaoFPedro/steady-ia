  <text x="145" y="250" text-anchor="middle" font-size="10" fill="#64748B">.cursor/rules/</text>

  <rect x="50" y="264" width="190" height="24" rx="4" fill="white" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="280" font-size="9" font-family="Consolas, monospace" fill="#085041">sdd-kit.mdc</text>
  <text x="230" y="280" text-anchor="end" font-size="8" fill="#64748B">alwaysApply</text>

  <rect x="50" y="294" width="190" height="24" rx="4" fill="white" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="310" font-size="9" font-family="Consolas, monospace" fill="#085041">lightweight-mode.mdc</text>
  <text x="230" y="310" text-anchor="end" font-size="8" fill="#64748B">src/**</text>

