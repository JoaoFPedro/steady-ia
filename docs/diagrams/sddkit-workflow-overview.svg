<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Workflow SDD Kit — do setup à manutenção</text>

  <!-- Phase 1: Setup -->
  <rect x="30" y="50" width="200" height="120" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="130" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">Setup</text>
  <text x="130" y="88" text-anchor="middle" font-size="10" fill="#64748B">uma vez por projeto</text>

  <rect x="45" y="100" width="170" height="26" rx="6" fill="white" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="130" y="117" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">./sdd init ou /onboard</text>

  <rect x="45" y="132" width="170" height="26" rx="6" fill="white" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="130" y="149" text-anchor="middle" font-size="10" font-weight="500" fill="#444441">→ scan → STACK.md</text>

  <line x1="230" y1="110" x2="260" y2="110" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 2: Discovery -->
  <rect x="262" y="50" width="200" height="120" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="0.5"/>
  <text x="362" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#854F0B">Discovery</text>
  <text x="362" y="88" text-anchor="middle" font-size="10" fill="#64748B">Produto &amp; Design</text>

  <rect x="277" y="100" width="170" height="26" rx="6" fill="white" stroke="#D97706" stroke-width="0.5"/>
  <text x="362" y="117" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">/discover</text>

  <rect x="277" y="132" width="170" height="26" rx="6" fill="white" stroke="#D97706" stroke-width="0.5"/>
  <text x="362" y="149" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">→ .discovery/{ID}/ + decisão</text>

  <line x1="462" y1="110" x2="492" y2="110" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 3: Spec -->
  <rect x="494" y="50" width="200" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="594" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Especificação</text>
  <text x="594" y="88" text-anchor="middle" font-size="10" fill="#64748B">Three Amigos</text>

  <rect x="509" y="100" width="170" height="26" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="594" y="117" text-anchor="middle" font-size="10" font-weight="500" fill="#3C3489">/spec</text>

  <rect x="509" y="132" width="170" height="26" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="594" y="149" text-anchor="middle" font-size="10" font-weight="500" fill="#3C3489">→ spec.bdd.md + tasks.md</text>

  <!-- Arrow down from Spec -->
  <line x1="594" y1="170" x2="594" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 4: Analyze (optional) -->
  <rect x="494" y="205" width="200" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="594" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">Análise</text>
  <text x="594" y="246" text-anchor="middle" font-size="10" fill="#64748B">features complexas (opcional)</text>

  <rect x="509" y="258" width="170" height="22" rx="6" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="594" y="273" text-anchor="middle" font-size="10" font-weight="500" fill="#0C447C">/analyze → riscos + direção</text>

  <!-- Arrow down to pipeline -->
  <line x1="594" y1="285" x2="594" y2="310" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 5: TDD pipeline -->
  <rect x="30" y="315" width="664" height="120" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="362" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Implementação — Engineer &amp; QA</text>

  <rect x="50" y="355" width="140" height="50" rx="8" fill="white" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="375" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">RED</text>
  <text x="120" y="392" text-anchor="middle" font-size="9" fill="#64748B">teste traduz BDD</text>

  <line x1="190" y1="380" x2="220" y2="380" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

  <rect x="222" y="355" width="140" height="50" rx="8" fill="white" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="292" y="375" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">GREEN — KISS</text>
  <text x="292" y="392" text-anchor="middle" font-size="9" fill="#64748B">mínimo para passar</text>

  <line x1="362" y1="380" x2="392" y2="380" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

  <rect x="394" y="355" width="140" height="50" rx="8" fill="white" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="464" y="375" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">REFACTOR</text>
  <text x="464" y="392" text-anchor="middle" font-size="9" fill="#64748B">SOLID + DRY</text>

  <line x1="534" y1="380" x2="556" y2="380" stroke="#888780" stroke-width="1" marker-end="url(#a)"/>

  <rect x="558" y="355" width="120" height="50" rx="8" fill="white" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="618" y="375" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">/implement</text>
  <text x="618" y="392" text-anchor="middle" font-size="9" fill="#64748B">TDD por cenário</text>

  <text x="362" y="425" text-anchor="middle" font-size="10" fill="#085041">Não avança sem cenário anterior verde</text>

  <!-- Arrow down -->
  <line x1="362" y1="435" x2="362" y2="465" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Phase 6: Review + Sync -->
  <rect x="30" y="470" width="320" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="190" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#712B13">Review</text>
  <text x="190" y="512" text-anchor="middle" font-size="10" fill="#64748B">auto-disparado pelo /implement</text>

  <rect x="50" y="525" width="130" height="28" rx="6" fill="white" stroke="#993C1D" stroke-width="0.5"/>
  <text x="115" y="543" text-anchor="middle" font-size="10" font-weight="500" fill="#712B13">/review (auto)</text>

  <rect x="195" y="525" width="140" height="28" rx="6" fill="white" stroke="#993C1D" stroke-width="0.5"/>
  <text x="265" y="543" text-anchor="middle" font-size="10" fill="#712B13">código vs spec + OWASP</text>
  <text x="265" y="555" text-anchor="middle" font-size="9" fill="#64748B">+ Playbook checks</text>

  <line x1="350" y1="530" x2="380" y2="530" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="382" y="470" width="312" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="538" y="495" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Sync</text>
  <text x="538" y="512" text-anchor="middle" font-size="10" fill="#64748B">ao longo do tempo</text>

  <rect x="402" y="525" width="130" height="28" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="467" y="543" text-anchor="middle" font-size="10" font-weight="500" fill="#3C3489">/sync</text>

  <rect x="547" y="525" width="130" height="28" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="612" y="543" text-anchor="middle" font-size="10" fill="#3C3489">spec ↔ código</text>
  <text x="612" y="555" text-anchor="middle" font-size="9" fill="#64748B">bidirecional</text>

  <!-- Bottom note -->
  <text x="360" y="610" text-anchor="middle" font-size="11" fill="#888780">Discovery First → Spec First → Test First → sempre sincronizado</text>
</svg>
