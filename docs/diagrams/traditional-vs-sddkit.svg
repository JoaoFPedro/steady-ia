<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Modo tradicional vs SDD Kit</text>

  <!-- Traditional side -->
  <rect x="30" y="50" width="310" height="450" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#791F1F">Tradicional — chat direto</text>
  <text x="185" y="96" text-anchor="middle" font-size="11" fill="#A32D2D">"Faz um endpoint de login pra mim"</text>

  <rect x="50" y="115" width="270" height="36" rx="6" fill="white" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="137" text-anchor="middle" font-size="11" fill="#791F1F">Dev manda descrição vaga no chat</text>

  <line x1="185" y1="151" x2="185" y2="165" stroke="#DC2626" stroke-width="1"/>
  <rect x="50" y="167" width="270" height="36" rx="6" fill="white" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="189" text-anchor="middle" font-size="11" fill="#791F1F">IA gera código direto (sem spec)</text>

  <line x1="185" y1="203" x2="185" y2="217" stroke="#DC2626" stroke-width="1"/>
  <rect x="50" y="219" width="270" height="36" rx="6" fill="white" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="241" text-anchor="middle" font-size="11" fill="#791F1F">Dev copia e cola no projeto</text>

  <line x1="185" y1="255" x2="185" y2="269" stroke="#DC2626" stroke-width="1"/>
  <rect x="50" y="271" width="270" height="36" rx="6" fill="white" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="293" text-anchor="middle" font-size="11" fill="#791F1F">Bug encontrado → volta pro chat</text>

  <line x1="185" y1="307" x2="185" y2="321" stroke="#DC2626" stroke-width="1"/>
  <rect x="50" y="323" width="270" height="36" rx="6" fill="white" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="345" text-anchor="middle" font-size="11" fill="#791F1F">IA perde contexto → reexplica tudo</text>

  <line x1="185" y1="359" x2="185" y2="373" stroke="#DC2626" stroke-width="1"/>
  <rect x="50" y="375" width="270" height="36" rx="6" fill="white" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="397" text-anchor="middle" font-size="11" fill="#791F1F">Spec? Teste? ADR? Nada registrado.</text>

  <rect x="50" y="425" width="270" height="56" rx="8" fill="#FCEBEB" stroke="#DC2626" stroke-width="0.5"/>
  <text x="185" y="447" text-anchor="middle" font-size="11" font-weight="600" fill="#791F1F">Resultado:</text>
  <text x="185" y="465" text-anchor="middle" font-size="10" fill="#A32D2D">Código sem spec, sem teste, sem rastreabilidade.</text>
  <text x="185" y="478" text-anchor="middle" font-size="10" fill="#A32D2D">Contexto perdido a cada sessão.</text>

  <!-- SDD Kit side -->
  <rect x="380" y="50" width="310" height="450" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#27500A">SDD Kit — workflow estruturado</text>
  <text x="535" y="96" text-anchor="middle" font-size="11" fill="#3B6D11">/discover → /spec → /implement</text>

  <rect x="400" y="115" width="270" height="36" rx="6" fill="white" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="133" text-anchor="middle" font-size="11" fill="#27500A">Discovery: problema → hipótese → decisão</text>

  <line x1="535" y1="151" x2="535" y2="165" stroke="#16A34A" stroke-width="1"/>
  <rect x="400" y="167" width="270" height="36" rx="6" fill="white" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="185" text-anchor="middle" font-size="11" fill="#27500A">Story + Spec BDD (Three Amigos) → Gate</text>

  <line x1="535" y1="203" x2="535" y2="217" stroke="#16A34A" stroke-width="1"/>
  <rect x="400" y="219" width="270" height="36" rx="6" fill="white" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="237" text-anchor="middle" font-size="11" fill="#27500A">Blueprint + ADR (se fluxo > 2 passos)</text>

  <line x1="535" y1="255" x2="535" y2="269" stroke="#16A34A" stroke-width="1"/>
  <rect x="400" y="271" width="270" height="36" rx="6" fill="white" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="289" text-anchor="middle" font-size="11" fill="#27500A">TDD: RED → GREEN → REFACTOR</text>

  <line x1="535" y1="307" x2="535" y2="321" stroke="#16A34A" stroke-width="1"/>
  <rect x="400" y="323" width="270" height="36" rx="6" fill="white" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="341" text-anchor="middle" font-size="11" fill="#27500A">Review vs spec + OWASP + Playbook</text>

  <line x1="535" y1="359" x2="535" y2="373" stroke="#16A34A" stroke-width="1"/>
  <rect x="400" y="375" width="270" height="36" rx="6" fill="white" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="393" text-anchor="middle" font-size="11" fill="#27500A">Sync: spec ↔ código sempre alinhados</text>

  <rect x="400" y="425" width="270" height="56" rx="8" fill="#EAF3DE" stroke="#16A34A" stroke-width="0.5"/>
  <text x="535" y="447" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">Resultado:</text>
  <text x="535" y="465" text-anchor="middle" font-size="10" fill="#3B6D11">Código com spec, testes, ADRs, discovery.</text>
  <text x="535" y="478" text-anchor="middle" font-size="10" fill="#3B6D11">Harness (Guides+Sensors) garante qualidade.</text>
</svg>
