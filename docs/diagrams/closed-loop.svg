<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Closed loop — spec e código nunca divergem</text>

  <!-- Top: Discovery -->
  <rect x="260" y="45" width="200" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="0.5"/>
  <text x="360" y="66" text-anchor="middle" font-size="11" font-weight="500" fill="#854F0B">.discovery/{DISC-ID}/</text>
  <text x="360" y="82" text-anchor="middle" font-size="10" fill="#D97706">problem + hypothesis + decision</text>

  <!-- Arrow from discovery to specs -->
  <line x1="360" y1="95" x2="360" y2="140" stroke="#D97706" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="395" y="120" font-size="9" fill="#D97706">decisão: Construir</text>

  <!-- Central: specs/ -->
  <rect x="250" y="145" width="220" height="100" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="360" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#085041">specs/{id}/</text>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#0F6E56">story + spec.bdd + blueprint</text>
  <text x="360" y="217" text-anchor="middle" font-size="11" fill="#0F6E56">tasks</text>

  <!-- Left: Requisito muda -->
  <rect x="30" y="60" width="170" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="115" y="81" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">Requisito muda</text>
  <text x="115" y="97" text-anchor="middle" font-size="10" fill="#534AB7">/spec ou /discover</text>

  <path d="M200 85 L250 165" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="210" y="135" font-size="9" fill="#534AB7" transform="rotate(-30 210 135)">atualiza spec</text>

  <!-- Right: Código muda -->
  <rect x="520" y="60" width="170" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="605" y="81" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13">Código muda</text>
  <text x="605" y="97" text-anchor="middle" font-size="10" fill="#993C1D">refactor, fix, PR</text>

  <path d="M520 85 L470 165" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="510" y="135" font-size="9" fill="#993C1D" transform="rotate(30 510 135)">sync → spec</text>

  <!-- Bottom left: Code -->
  <rect x="50" y="300" width="170" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="135" y="326" text-anchor="middle" font-size="12" font-weight="500" fill="#444441">src/ + tests/</text>
  <text x="135" y="344" text-anchor="middle" font-size="10" fill="#888780">código de produção</text>

  <path d="M250 235 L180 300" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="198" y="278" font-size="9" fill="#0F6E56" transform="rotate(35 198 278)">/implement (TDD)</text>

  <!-- Bottom right: Review -->
  <rect x="500" y="300" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="585" y="326" text-anchor="middle" font-size="12" font-weight="500" fill="#27500A">/review (auto)</text>
  <text x="585" y="344" text-anchor="middle" font-size="10" fill="#3B6D11">disparado pelo /implement</text>

  <path d="M470 235 L540 300" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Sync arrow: code ↔ spec -->
  <path d="M220 330 L500 330" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="360" y="350" text-anchor="middle" font-size="10" fill="#534AB7">/sync mantém alinhado</text>

  <!-- Loop arrow -->
  <path d="M135 360 Q135 400 360 400 Q585 400 585 360" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="360" y="420" text-anchor="middle" font-size="10" fill="#888780">próxima feature ou iteração → novo /discover</text>

  <!-- Roles labels -->
  <text x="360" y="436" text-anchor="middle" font-size="10" fill="#64748B">Produto &amp; Design (spec) ↔ Engineer &amp; QA (código)</text>
</svg>
