<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Ciclo TDD — princípio por fase</text>

  <!-- RED -->
  <rect x="60" y="55" width="180" height="120" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="150" y="84" text-anchor="middle" font-size="15" font-weight="500" fill="#791F1F">RED — teste falha</text>
  <text x="150" y="108" text-anchor="middle" font-size="12" fill="#A32D2D">Princípio: BDD</text>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#A32D2D">O teste traduz o cenário</text>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#A32D2D">Given / When / Then</text>
  <text x="150" y="162" text-anchor="middle" font-size="11" fill="#A32D2D">Nada mais</text>

  <line x1="240" y1="115" x2="278" y2="115" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- GREEN -->
  <rect x="280" y="55" width="180" height="120" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="370" y="84" text-anchor="middle" font-size="15" font-weight="500" fill="#27500A">GREEN — passa</text>
  <text x="370" y="108" text-anchor="middle" font-size="12" fill="#3B6D11">Princípio: KISS</text>
  <text x="370" y="128" text-anchor="middle" font-size="11" fill="#3B6D11">Mínimo para passar</text>
  <text x="370" y="145" text-anchor="middle" font-size="11" fill="#3B6D11">Simples e óbvio</text>
  <text x="370" y="162" text-anchor="middle" font-size="11" fill="#3B6D11">Zero abstração extra</text>

  <line x1="460" y1="115" x2="498" y2="115" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- REFACTOR -->
  <rect x="500" y="55" width="180" height="120" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="590" y="84" text-anchor="middle" font-size="15" font-weight="500" fill="#0C447C">REFACTOR</text>
  <text x="590" y="108" text-anchor="middle" font-size="12" fill="#185FA5">Princípios: SOLID + DRY</text>
  <text x="590" y="128" text-anchor="middle" font-size="11" fill="#185FA5">Estrutura com SRP</text>
  <text x="590" y="145" text-anchor="middle" font-size="11" fill="#185FA5">Elimina duplicação</text>
  <text x="590" y="162" text-anchor="middle" font-size="11" fill="#185FA5">Limita-se por KISS</text>

  <!-- Loop arrow -->
  <path d="M590 175 L590 200 L150 200 L150 175" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#a)"/>
  <text x="370" y="218" text-anchor="middle" font-size="12" fill="#888780">próximo cenário BDD</text>

  <!-- Priority bar -->
  <rect x="60" y="240" width="620" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="80" y="267" font-size="12" font-weight="500" fill="#2C2C2A">Prioridade:</text>

  <rect x="170" y="250" width="80" height="24" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="210" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">KISS</text>

  <text x="260" y="267" font-size="11" fill="#888780">limita →</text>

  <rect x="310" y="250" width="80" height="24" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="350" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">SOLID</text>

  <text x="400" y="267" font-size="11" fill="#888780">guia →</text>

  <rect x="440" y="250" width="80" height="24" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="#712B13">DRY</text>

  <text x="530" y="267" font-size="11" fill="#888780">regra de 3 →</text>

  <rect x="600" y="250" width="70" height="24" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="635" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="#444441">Extrair</text>
</svg>
