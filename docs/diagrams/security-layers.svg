<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">Segurança — dimensão transversal, não fase separada</text>

  <!-- Top principle -->
  <rect x="180" y="45" width="360" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
  <text x="360" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">Security First — CONSTITUTION.md princípio #2</text>

  <!-- Two sensor types -->
  <rect x="30" y="100" width="320" height="180" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Sensores Computacionais</text>
  <text x="190" y="143" text-anchor="middle" font-size="10" fill="#64748B">determinísticos, rápidos, automáticos</text>

  <rect x="50" y="158" width="280" height="28" rx="6" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#0C447C">pre-commit hook: secrets, .env, padrões perigosos</text>

  <rect x="50" y="192" width="280" height="28" rx="6" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="210" text-anchor="middle" font-size="11" fill="#0C447C">linters + type checkers: injection patterns</text>

  <rect x="50" y="226" width="280" height="28" rx="6" fill="white" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="244" text-anchor="middle" font-size="11" fill="#0C447C">healthcheck: deps vulneráveis (CVE scan)</text>

  <rect x="370" y="100" width="320" height="180" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Sensores Inferenciais</text>
  <text x="530" y="143" text-anchor="middle" font-size="10" fill="#64748B">LLM-based, semânticos, /review</text>

  <rect x="390" y="158" width="280" height="28" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="176" text-anchor="middle" font-size="11" fill="#3C3489">Broken Access Control (A01)</text>

  <rect x="390" y="192" width="280" height="28" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="210" text-anchor="middle" font-size="11" fill="#3C3489">Insecure Design (A04)</text>

  <rect x="390" y="226" width="280" height="28" rx="6" fill="white" stroke="#534AB7" stroke-width="0.5"/>
  <text x="530" y="244" text-anchor="middle" font-size="11" fill="#3C3489">Auth Failures + Integrity + SSRF (A07-A10)</text>

  <!-- OWASP coverage map -->
  <rect x="30" y="300" width="660" height="100" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="360" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Cobertura OWASP Top 10 por camada</text>

  <!-- Auto-detected -->
  <rect x="50" y="340" width="180" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="140" y="355" text-anchor="middle" font-size="10" font-weight="500" fill="#0C447C">Automático: A02, A03, A05, A06, A10</text>

  <!-- Inferential -->
  <rect x="245" y="340" width="200" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="345" y="355" text-anchor="middle" font-size="10" font-weight="500" fill="#3C3489">Inferencial: A01, A04, A07, A08, A09</text>

  <!-- Both -->
  <rect x="460" y="340" width="210" height="22" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="565" y="355" text-anchor="middle" font-size="10" font-weight="500" fill="#27500A">Todos cobertos no /review checklist</text>

  <text x="360" y="388" text-anchor="middle" font-size="11" fill="#5F5E5A">Nenhum secret no código. Nenhum input externo confiável sem validação.</text>

  <!-- Where security acts in the flow -->
  <rect x="30" y="420" width="660" height="86" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="0.5"/>
  <text x="360" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#854F0B">Onde segurança atua no fluxo</text>

  <rect x="50" y="458" width="130" height="34" rx="6" fill="white" stroke="#D97706" stroke-width="0.5"/>
  <text x="115" y="472" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">RED (TDD)</text>
  <text x="115" y="485" text-anchor="middle" font-size="9" fill="#64748B">cenário inclui threat</text>

  <rect x="195" y="458" width="130" height="34" rx="6" fill="white" stroke="#D97706" stroke-width="0.5"/>
  <text x="260" y="472" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">GREEN (impl)</text>
  <text x="260" y="485" text-anchor="middle" font-size="9" fill="#64748B">validação + sanitização</text>

  <rect x="340" y="458" width="130" height="34" rx="6" fill="white" stroke="#D97706" stroke-width="0.5"/>
  <text x="405" y="472" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">pre-commit</text>
  <text x="405" y="485" text-anchor="middle" font-size="9" fill="#64748B">bloqueia secrets</text>

  <rect x="485" y="458" width="130" height="34" rx="6" fill="white" stroke="#D97706" stroke-width="0.5"/>
  <text x="550" y="472" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">/review</text>
  <text x="550" y="485" text-anchor="middle" font-size="9" fill="#64748B">OWASP Top 10 check</text>

  <!-- Bottom -->
  <text x="360" y="515" text-anchor="middle" font-size="11" fill="#888780">Segurança é uma dimensão de cada cenário BDD — não uma fase final.</text>
</svg>
